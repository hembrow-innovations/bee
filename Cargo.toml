[package]
name = "bee"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "bee"

[[bin]]
name = "bee"
path = "src/main.rs"

[[bin]]
name = "hivemind"
path = "src/bin/hivemind.rs"

[[bin]]
name = "odm"
path = "src/bin/odm.rs"

[[bin]]
name = "heio"
path = "src/bin/heio.rs"

[workspace]
resolver = "2"
members = [
    "crates/git",
    "crates/core",
    "crates/store",
    "crates/actions",
    "crates/cli",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
hive-git = { path = "crates/git" }
hive-core = { path = "crates/core" }
hive-store = { path = "crates/store" }
hive-actions = { path = "crates/actions" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
tempfile = "3"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
hive-actions = { workspace = true }
hive-core = { workspace = true }
hive-git = { workspace = true }
hive-store = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
