[package]
name = "odm"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "ODM CLI — Orchestrated Development Management"

[lib]
name = "odm"
path = "src/lib.rs"

[[bin]]
name = "odm"
path = "src/main.rs"

[dependencies]
odm-core = { workspace = true }
odm-git = { workspace = true }
odm-progen = { workspace = true }
odm-actions = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
assert_cmd = "2"
predicates = "3"
